# ====================================================
# GRPO 训练及评估配置文件
# 用途：集中管理大模型后训练（GRPO + LoRA）的所有配置参数
# 说明：所有脚本从本文件读取配置，避免硬编码
# ====================================================

# ==================== 模型配置 ====================
ModelConfig:
  # 基座模型路径（本地绝对路径）
  # model_name_or_path: "E:\\LLM\\models\\Qwen\\Qwen2-0___5B"
  model_name_or_path: "D:\\FolderDirectory\\material\\CETC\\SelfProject\\TestPython\\models\\Qwen\\Qwen3___5-2B"
  # 最大输入 token 数（用于生成阶段截断）
  max_input_tokens: 2048
  # 设备设置："auto" 自动选择，"cuda:0" 指定 GPU，"cpu" CPU
  device: "auto"
  # 系统提示词（构造 chat template 时作为 system 角色内容）
  system_prompt: "你是一个有用的 AI 助手。"
  # 模型权重精度，可选："bfloat16" / "float16" / "float32"
  # 需与 accelerate_config.yaml 的 mixed_precision 保持一致
  torch_dtype: "bfloat16"
  # 是否 8bit 量化加载（显存受限时启用，与 4bit 互斥）
  load_in_8bit: false
  # 是否 4bit 量化加载（显存受限时启用，与 8bit 互斥）
  load_in_4bit: false

# ==================== 数据集配置 ====================
DataSetConfig:
  # 训练数据集文件路径
  train_data_path: "example_data/data_train.jsonl"
  # 测试数据集文件路径
  test_data_path: "example_data/data_test.jsonl"
  # 训练数据集使用率（0~1），1 表示使用 100%
  train_data_ratio: 1.0
  # 测试数据集使用率（0~1），1 表示使用 100%
  test_data_ratio: 1.0
  # 从训练数据集中划分验证集的占比（0~1），剩余部分作为实际训练集
  validation_split_ratio: 0.4

# ==================== 训练配置 ====================
# 以下配置项将整体传入 GRPOConfig(**TrainConfig, ...)
TrainConfig:
  # 输出目录（训练检查点保存位置，与 OutputConfig.checkpoint_dir 保持一致）
  output_dir: "output/checkpoints"
  # 学习率
  learning_rate: 5.0e-6
  # Adam 优化器参数
  adam_beta1: 0.9
  adam_beta2: 0.999
  # L2 正则化系数
  weight_decay: 0.01
  # 预热步数（前 N 步线性增加学习率）
  warmup_steps: 3
  # 学习率调度器类型
  lr_scheduler_type: "cosine"
  # ===== GRPO 核心参数 =====
  # KL 散度惩罚系数（控制与参考模型的偏离程度）
  beta: 0.01
  # 每个 prompt 生成的样本数
  num_generations: 2
  # 是否对组内奖励进行归一化
  scale_rewards: true
  # 单次生成最大 token 数
  max_completion_length: 256
  # ===== Batch 配置 =====
  # 单设备训练 batch 大小（需能被 num_generations 整除）
  per_device_train_batch_size: 2
  # 单设备评估 batch 大小（需能被 num_generations 整除）
  per_device_eval_batch_size: 2
  # 梯度累积步数
  gradient_accumulation_steps: 2
  # ===== 训练控制 =====
  # 训练轮次
  num_train_epochs: 1
  # 日志打印步数间隔
  logging_steps: 1
  # 是否禁用外部报告器（如 wandb/tensorboard）
  report_to: []
  # 是否显示进度条（置 true 可在 Trainer 构造前生效，避免进度条覆盖 stdout 日志）
  disable_tqdm: true
  # ===== 生成控制参数 =====
  # 采样温度（0~1，越低越确定）
  temperature: 0.8
  # 核采样阈值
  top_p: 0.9
  # ===== 评估与保存 =====
  # 是否在训练开始前执行评估
  eval_on_start: true
  # 评估策略："epoch" 每轮评估一次
  eval_strategy: "epoch"
  # 保存策略："best" 保存最佳模型（由 eval_reward 决定）
  save_strategy: "best"
  # 是否加载最佳模型到训练结束
  load_best_model_at_end: true
  # 评估指标名称（load_best_model_at_end 需要）
  metric_for_best_model: "eval_reward"
  # 最佳模型优化方向："max" 越大越好
  greater_is_better: true
  # 最多保留的检查点数量
  save_total_limit: 1

# ==================== LoRA 配置 ====================
LoraParamConfig:
  # LoRA 秩
  r: 8
  # LoRA 缩放系数（通常取 1-2 * r）
  lora_alpha: 32
  # LoRA Dropout
  lora_dropout: 0.1
  # 目标模块（需要应用 LoRA 的注意力模块）
  target_modules:
    - "q_proj"
    - "v_proj"

# ==================== 奖励函数配置 ====================
RewardFuncConfig:
  # 各奖励分量的权重字典
  weights:
    # 长度奖励权重（衡量生成内容与参考答案长度的接近程度）
    length: 0.5
    # 文字匹配奖励权重（衡量生成内容与参考答案首字符的一致性）
    match: 0.5
  # 答案提取标签（从生成文本中提取实际答案的分隔符）
  answer_tag: ""
  # 违禁字符串列表（命中后奖励归零）
  forbidden_strings: []

# ==================== 评估配置 ====================
EvalConfig:
  # 是否评估基座模型
  eval_base_model: true
  # 是否评估微调后模型
  eval_finetuned_model: true
  # 基座模型路径（为空时默认使用 ModelConfig.model_id）
  base_model_path: ""
  # 微调后模型路径（训练完成后自动使用输出目录）
  finetuned_model_path: ""
  # 测试数据集路径（为空时默认使用 DataSetConfig.test_data_path）
  test_data_path: ""
  # 每个 prompt 生成 N 个回答（用于 Pass@k 计算）
  num_generations_per_prompt: 4
  # 评估时推理 batch 大小
  eval_batch_size: 2
  # 评估时最大生成 token 数
  max_eval_completion_length: 256
  # 评估采样温度
  eval_temperature: 0.8
  # 评估核采样阈值
  eval_top_p: 0.9
  # 评估报告输出目录
  output_dir: "output/eval"

# ==================== 绘图配置 ====================
PlotConfig:
  # 日志文件路径（固定读取当前训练日志）
  log_file: "output/logs/train_log.jsonl"
  # 子图列数
  ncols: 3
  # 子图垂直间距
  hspace: 0.45
  # 子图水平间距
  wspace: 0.30
  # 总标题 Y 轴位置
  y_title: 0.96
  # 从第几步开始绘制（跳过前 N 步）
  start_index: 0
  # 采样步长（滑动窗口平滑，>1 时启用）
  stride: 10
  # 输出目录
  output_dir: "output/plots"

# ==================== 输出配置 ====================
OutputConfig:
  # 输出根目录
  base_dir: "./output"
  # 训练日志输出目录
  train_log_dir: "./output/logs"
  # 检查点保存目录
  checkpoint_dir: "./output/checkpoints"
  # 评估报告输出目录
  eval_dir: "./output/eval"
  # 绘图输出目录
  plot_dir: "./output/plots"
  # 最终模型保存目录
  final_model_dir: "./output/final_model"
